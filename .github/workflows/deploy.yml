# FotoAlert – Automatisches Deployment via GitHub Actions
# Trigger: Push auf den main-Branch
#
# Voraussetzung (einmalig in GitHub unter Settings → Secrets einrichten):
#   DEPLOY_SSH_KEY           – Privater SSH-Key (Ed25519) für Zugriff auf Hetzner-Server
#   SERVER_IP                – IP-Adresse des Hetzner-Servers (z.B. 1.2.3.4)
#   SERVER_USER              – SSH-Username auf dem Server (fotoalert)
#   SERVER_KNOWN_HOSTS        – TASK-87(e): fest hinterlegter Server-Fingerabdruck (Ausgabe von
#                              `ssh-keyscan -H <SERVER_IP>`, vorab vertrauenswürdig geprüft),
#                              ersetzt das frühere live/ungeprüfte ssh-keyscan bei jedem Deploy
#   FOTOALERT_USER_PASSWORD  – Test-Passwort für Playwright-Login (TASK-21)
#   FOTOALERT_HOST_PASSWORD  – Host-Passwort für Dev-Server (TASK-21)
#   FOTOALERT_AUTH_SECRET    – Auth-Secret für Dev-Server (TASK-21)
#   FOTOALERT_LIVECHECK_PASSWORD – TASK-118: Gast-Passwort der ECHTEN Seite für den Live-Check nach
#                              dem Veröffentlichen (rein lesender Kurztest). Eigenes Geheimnis, wird
#                              nur vom Live-Check benutzt, nie die drei Test-Server-Geheimnisse oben.
#                              Ändert sich das Gast-Passwort der echten Seite, muss dieses Geheimnis
#                              mitgeändert werden. Fehlt es (oder ist leer), scheitert die Vorab-Probe
#                              und es wird NICHT veröffentlicht („Prüfung nicht einsatzbereit“).
#
# TASK-118 – Ablauf des Jobs „deploy“:
#   Vorab-Probe (Kurztest gegen die noch laufende Version) → Veröffentlichen → Live-Check (Kurztest
#   über die öffentliche Adresse) → bei Rot: automatischer Rücksprung auf die zuletzt bestätigte
#   Version → erneuter Live-Check → Meldung. Ein Lauf mit Rücksprung endet immer rot.
#   Reihenfolge-Sperre: Veröffentlichungen laufen nacheinander (concurrency). Die Schalter
#   „uebungsmodus“ (Teststufe 3) und „brandprobe“ (Teststufe 4) gibt es nur beim manuellen Anstoßen;
#   bei jeder normalen Veröffentlichung (Push auf main) sind sie aus und nicht setzbar.

name: Deploy to Hetzner

on:
  push:
    branches:
      - main
    # TASK-59 Option E: Der geplante update-building-data.yml-Workflow
    # committet ausschließlich diese eine Datendatei. Sie soll für sich allein
    # KEINEN Produktions-Deploy auslösen (Gebäudedaten-Update ≠ App-Release).
    # Ändert ein Commit ZUSÄTZLICH andere Dateien, greift dieser Ausschluss
    # nicht mehr und der Deploy läuft wie gewohnt.
    paths-ignore:
      - 'FotoAlert/backend/data/cache/building_footprints.json'
  # Manueller Trigger: in GitHub unter Actions → Run workflow
  # TASK-118: Die beiden Schalter existieren NUR hier (beim Push auf main sind sie nie gesetzt).
  workflow_dispatch:
    inputs:
      uebungsmodus:
        description: 'Übung (Teststufe 3): nichts wird veröffentlicht, Rücksprung nur als Platzhalter; der Kurztest läuft gegen einen Test-Server im Lauf'
        type: boolean
        default: false
      brandprobe:
        description: 'Brandprobe (Teststufe 4, nur nach Absprache): echte Veröffentlichung, Live-Check scheitert absichtlich → echter Rücksprung'
        type: boolean
        default: false

jobs:
  # TASK-21: Frontend-Test-Gate — läuft VOR dem Deploy.
  # Deploy startet nur wenn dieser Job UND test-backend (TASK-64) grün sind.
  test-frontend:
    name: Frontend-Check (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FOTOALERT_ENV: dev
      FOTOALERT_NO_BACKGROUND: "1"
      FOTOALERT_HOST_PASSWORD: ${{ secrets.FOTOALERT_HOST_PASSWORD }}
      FOTOALERT_USER_PASSWORD: ${{ secrets.FOTOALERT_USER_PASSWORD }}
      FOTOALERT_AUTH_SECRET: ${{ secrets.FOTOALERT_AUTH_SECRET }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4.2.2

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        working-directory: FotoAlert/backend
        run: pip install -r requirements.txt

      # TASK-117 (AK11): feste Version aus requirements-browser.txt statt „jeweils neueste“ —
      # dieselbe Datei nutzt der Probelauf von release.sh auf dem Mac.
      - name: Playwright Chromium installieren
        working-directory: FotoAlert/backend
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install chromium

      # BUG-79-Nachtrag (US-137-Release, 2026-09-24): dieselbe Ephemeriden-Absicherung wie
      # im test-backend-Job unten (BUG-79) fehlte hier im test-frontend-Job komplett. Der
      # Dev-Server dieses Jobs lädt de421.bsp beim ersten Astronomie-Aufruf synchron und
      # blockierend nach — bislang bei JEDEM Lauf dieses Jobs neu heruntergeladen (kein
      # Cache-Schritt vorhanden, nicht nur gelegentlicher Cache-Miss), was den einzelnen
      # Dev-Server-Prozess für die Downloaddauer blockiert und nachfolgende Playwright-
      # Checks (u. a. save-location-btn-Sichtbarkeit, Karten-Filter-Marker) reihenweise in
      # ihre Timeouts laufen lässt. Fund: zwei aufeinanderfolgende CI-Läufe von Run #353
      # (e2e2cf1) mit identischem Fehlerbild, siehe fotoalert-ci-server.log beider Läufe.
      - name: Ephemeride (de421.bsp) aus CI-Cache wiederherstellen
        id: cache-ephemeris
        uses: actions/cache@v4
        with:
          path: FotoAlert/backend/de421.bsp
          key: de421-bsp-v1

      - name: de421.bsp herunterladen (nur bei Cache-Miss, mit Timeout-Absicherung)
        if: steps.cache-ephemeris.outputs.cache-hit != 'true'
        timeout-minutes: 2
        working-directory: FotoAlert/backend
        run: |
          echo "Cache-Miss: lade de421.bsp (~17 MB) mit begrenztem Timeout, damit ein"
          echo "hängender/langsamer Drittserver nicht das Job-Timeout reißt."
          curl -fSL --max-time 90 \
            -o de421.bsp \
            https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de421.bsp \
            || { echo "❌ de421.bsp-Download fehlgeschlagen oder Timeout (90s) überschritten"; exit 1; }

      - name: Frontend-Check ausführen (gemeinsame Prüfliste, inkl. Backend-Playwright-Tests)
        # TASK-117 (AK10): Dev-Server (Port 8000), Frontend-Check und die drei Backend-Playwright-
        # Tests laufen über die gemeinsame Prüfliste — dieselbe, die der Probelauf von release.sh
        # aufruft. Inhalt wie bisher: run_frontend_check.py, danach BUG-100 gezielt nur
        # tests/test_bug_85.py, tests/test_bug-80.py, tests/test_task-66.py gegen den laufenden
        # Dev-Server. Server-Log, Screenshots und Findings landen wie bisher unter /tmp.
        run: bash FotoAlert/tools/pruefliste.sh oberflaechen_check browser_tests

      # TASK-97 (AK2): Bei jedem Job-Fehlschlag mehr Kontext als CI-Artefakt sichern,
      # damit ein künftiger ähnlicher Fall (wie der ungeklärte CI-Run #277 — Login-
      # Precondition-Fehler ohne Log-Auswertung) tatsächlich diagnostizierbar ist,
      # statt wie damals nur per Re-Run-Erfolg als Flake eingestuft zu werden.
      # Zeitpunkt (UTC) + Commit + Run-Verweis, damit sich das Artefakt eindeutig
      # einem Lauf/Commit zuordnen lässt.
      - name: CI-Kontext für Diagnose sichern
        if: always()
        run: |
          {
            echo "Zeitpunkt (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: ${{ github.sha }}"
            echo "Workflow-Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Job-Status: ${{ job.status }}"
          } > /tmp/fotoalert-ci-context.txt

      - name: Findings + Screenshots + Server-Log als CI-Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-findings-${{ github.run_id }}
          path: |
            /tmp/findings.json
            /tmp/qa-screenshots/
            /tmp/fotoalert-ci-server.log
            /tmp/fotoalert-ci-context.txt
          if-no-files-found: ignore

      # Die gemeinsame Prüfliste stoppt ihren Dev-Server selbst (auch bei Rot, TASK-117);
      # dieser Schritt bleibt als Sicherheitsnetz.
      - name: Dev-Server stoppen
        if: always()
        run: |
          if [ -f /tmp/fotoalert-ci-server.pid ]; then
            kill "$(cat /tmp/fotoalert-ci-server.pid)" 2>/dev/null || true
          fi

  # TASK-64: Backend-Test-Gate — läuft parallel zum Frontend-Check.
  # Deploy startet nur wenn beide Jobs grün sind (needs: [test-frontend, test-backend]).
  test-backend:
    name: Backend-Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4.2.2

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        working-directory: FotoAlert/backend
        run: pip install -r requirements.txt

      # BUG-79: de421.bsp (~17 MB Ephemeride) wird von calculations/astronomy.py::_get_eph()
      # bei jedem ersten Aufruf pro Testprozess ungemockt via skyfield.api.load() geladen —
      # nicht nur von den 3 @pytest.mark.online-Tests, sondern transitiv von ≥9 Funktionen.
      # Fester Cache-Key (NICHT an requirements.txt/Commit-Hash gekoppelt, siehe Pre-Mortem
      # Szenario 4 in BACKLOG.md BUG-79) — die Ephemeridendatei ändert sich nicht mit Code.
      - name: Ephemeride (de421.bsp) aus CI-Cache wiederherstellen
        id: cache-ephemeris
        uses: actions/cache@v4
        with:
          path: FotoAlert/backend/de421.bsp
          key: de421-bsp-v1

      # Cache-Miss-Fallback: eigener, timeout-abgesicherter Download VOR pytest, damit der
      # eigentliche Testschritt selbst nie einen unbegrenzten Live-Download auslösen kann.
      # curl --max-time (90s) + Step-Timeout (2 Min) als zweite Absicherung, falls curl selbst
      # aus irgendeinem Grund nicht rechtzeitig abbricht (AK2/AK6: klarer Fehlschlag < 2 Min,
      # statt in den globalen 15-Minuten-Job-Timeout zu laufen, siehe Zeile ~101).
      - name: de421.bsp herunterladen (nur bei Cache-Miss, mit Timeout-Absicherung)
        if: steps.cache-ephemeris.outputs.cache-hit != 'true'
        timeout-minutes: 2
        working-directory: FotoAlert/backend
        run: |
          echo "Cache-Miss: lade de421.bsp (~17 MB) mit begrenztem Timeout, damit ein"
          echo "hängender/langsamer Drittserver nicht das 15-Minuten-Job-Limit reißt."
          curl -fSL --max-time 90 \
            -o de421.bsp \
            https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de421.bsp \
            || { echo "❌ de421.bsp-Download fehlgeschlagen oder Timeout (90s) überschritten"; exit 1; }

      # TASK-117 (AK10): gleiche Suite (python3 -m pytest tests/ -v) über die gemeinsame Prüfliste.
      - name: Backend-Testsuite ausführen (gemeinsame Prüfliste)
        run: bash FotoAlert/tools/pruefliste.sh backend

  deploy:
    name: Deploy FotoAlert
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # TASK-118 (AK30): Reihenfolge-Sperre. Zwei Veröffentlichungen laufen nie gleichzeitig; die zweite
    # wartet, bis die erste samt Rücksprung fertig ist. GitHub hält je Gruppe höchstens einen
    # wartenden Lauf vor (ein noch älterer wartender wird verdrängt) – das ist unschädlich, weil der
    # Server ohnehin immer den neuesten Stand von main zieht.
    concurrency:
      group: fotoalert-veroeffentlichen
      cancel-in-progress: false

    env:
      # Öffentliche Adresse, wie Nutzer sie sehen (AK5). Im Übungsmodus ersetzt der Übungs-Schritt sie.
      LIVECHECK_ADRESSE: https://fotoalert.stephanschumann.com
      # AK31: Schalter gibt es nur bei manuellem Anstoß; sonst immer „nein“.
      UEBUNG: ${{ github.event_name == 'workflow_dispatch' && inputs.uebungsmodus && 'ja' || 'nein' }}
      BRANDPROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.brandprobe && 'ja' || 'nein' }}

    steps:
      # Der Server zieht beim Veröffentlichen immer den neuesten Stand von main (deploy.sh) –
      # deshalb auch hier main auschecken, damit die erwartete Version dazu passt.
      - name: Code auschecken
        uses: actions/checkout@v4.2.2
        with:
          ref: main

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Browser für den Kurztest (feste Version wie im Frontend-Check, TASK-117).
      - name: Playwright Chromium für den Live-Check installieren
        working-directory: FotoAlert/backend
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install chromium

      - name: Erwartete App-Version ermitteln
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*const APP_VERSION = '\([^']*\)'.*/\1/p" FotoAlert/web/index.html | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error title=Live-Check::Keine App-Version in web/index.html gefunden"
            exit 1
          fi
          echo "ERWARTETE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Erwartete Version: $VERSION"

      - name: SSH-Key einrichten
        if: env.UEBUNG != 'ja'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # TASK-87(e): fest hinterlegter Fingerabdruck statt live/ungeprüftem ssh-keyscan bei
          # jedem Deploy-Lauf — verhindert, dass sich beim Verbindungsaufbau unbemerkt ein
          # anderer Server als der echte ausgeben könnte. SERVER_KNOWN_HOSTS enthält die
          # known_hosts-Zeilen aus einem vorab vertrauenswürdig geprüften `ssh-keyscan`.
          echo "${{ secrets.SERVER_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      # Nur Übungsmodus (Teststufe 3): ein Test-Server im Lauf (die Attrappe der Tests mit festen
      # Testdaten) statt der echten Seite; der Prüf-Zugang der Attrappe ist der Wert des
      # Live-Check-Geheimnisses (fehlt es, bekommt sie einen Zufallswert und der Kurztest scheitert
      # wie gewünscht an „Geheimnis fehlt“).
      - name: Übungs-Testserver starten (nur Übungsmodus)
        if: env.UEBUNG == 'ja'
        shell: bash
        working-directory: FotoAlert/backend
        env:
          UEBUNG_GAST_PASSWORT: ${{ secrets.FOTOALERT_LIVECHECK_PASSWORD }}
        run: |
          [ -n "$UEBUNG_GAST_PASSWORT" ] || export UEBUNG_GAST_PASSWORT="$(openssl rand -hex 12)"
          export UEBUNG_HOST_PASSWORT="$(openssl rand -hex 12)"
          export UEBUNG_ADRESSDATEI="$RUNNER_TEMP/uebung_adresse.txt"
          rm -f "$UEBUNG_ADRESSDATEI"
          PYTHONPATH=. nohup python - > "$RUNNER_TEMP/uebung_server.log" 2>&1 <<'PY' &
          import os, time
          from tests.task118.attrappe import Attrappen, Lage
          a = Attrappen(Lage(os.environ["ERWARTETE_VERSION"], os.environ["UEBUNG_GAST_PASSWORT"],
                             os.environ["UEBUNG_HOST_PASSWORT"]))
          open(os.environ["UEBUNG_ADRESSDATEI"], "w").write(a.adresse)
          while True:
              time.sleep(60)
          PY
          for i in $(seq 1 30); do
            [ -s "$UEBUNG_ADRESSDATEI" ] && break
            sleep 1
          done
          if [ ! -s "$UEBUNG_ADRESSDATEI" ]; then
            echo "::error title=Übungsmodus::Test-Server ist nicht gestartet"
            cat "$RUNNER_TEMP/uebung_server.log"
            exit 1
          fi
          echo "LIVECHECK_ADRESSE=$(cat "$UEBUNG_ADRESSDATEI")" >> "$GITHUB_ENV"
          echo "ÜBUNG: Test-Server läuft unter $(cat "$UEBUNG_ADRESSDATEI")"

      # AK1–AK3: Vorab-Probe – derselbe Kurztest gegen die noch laufende (alte) Version. Scheitert
      # sie, wird nichts veröffentlicht und der Lauf endet rot („Prüfung nicht einsatzbereit“).
      - name: Vorab-Probe (Kurztest gegen die noch laufende Version)
        id: vorab
        timeout-minutes: 4
        shell: bash
        env:
          FOTOALERT_LIVECHECK_PASSWORD: ${{ secrets.FOTOALERT_LIVECHECK_PASSWORD }}
        run: |
          if [ -z "$(printenv FOTOALERT_LIVECHECK_PASSWORD || true)" ]; then
            echo "::error title=Prüfung nicht einsatzbereit::Das GitHub-Geheimnis FOTOALERT_LIVECHECK_PASSWORD fehlt oder ist leer. Es wurde kein Anmeldeversuch gemacht und nichts veröffentlicht."
            exit 1
          fi
          LAUFEND=$(curl -fsS --max-time 30 "$LIVECHECK_ADRESSE/" | sed -n "s/.*const APP_VERSION = '\([^']*\)'.*/\1/p" | head -1 || true)
          if [ -z "$LAUFEND" ]; then
            echo "::error title=Prüfung nicht einsatzbereit::Die laufende Seite ist nicht erreichbar oder zeigt keine App-Version. Nichts wurde veröffentlicht."
            exit 1
          fi
          echo "Laufende Version laut Seite: $LAUFEND"
          python FotoAlert/backend/tests/livecheck/kurztest.py \
            --adresse "$LIVECHECK_ADRESSE" --erwartete-version "$LAUFEND" \
            --ergebnis-ordner "$RUNNER_TEMP/livecheck/vorab"

      # AK24: Gibt es noch keine Marke „zuletzt bestätigt“, gilt die jetzt laufende Version als
      # bestätigt, weil die Vorab-Probe gegen sie bestanden ist. Das Skript kommt aus diesem
      # Checkout (auf dem Server liegt es beim allerersten Lauf noch nicht).
      - name: Erste Marke „zuletzt bestätigt“ setzen (nur wenn noch keine existiert)
        id: erstmarke
        shell: bash
        env:
          SSH_ZIEL: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}
        run: |
          if [ "$UEBUNG" = "ja" ]; then
            echo "ÜBUNG: Platzhalter – keine Marke gesetzt"
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
              "$SSH_ZIEL" "bash -s -- bestaetigen --nur-wenn-keine-marke" < FotoAlert/deploy/ruecksprung.sh

      - name: Veröffentlichen (Deploy auf Server)
        id: deploy
        # Der Schritt darf rot enden, damit die Nachprüfung und die Meldung noch laufen; das
        # Gesamtergebnis legt der letzte Schritt fest.
        continue-on-error: true
        shell: bash
        run: |
          if [ "$UEBUNG" = "ja" ]; then
            echo "ÜBUNG: Platzhalter – es wird nichts veröffentlicht"
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}" \
              "bash /opt/fotoalert/app/FotoAlert/deploy/deploy.sh" 2>&1 | tee "$RUNNER_TEMP/deploy-ausgabe.txt"

      # AK5: Der Live-Check startet ohne Zutun, nachdem das Veröffentlichen (inklusive Übernahme der
      # Webserver-Einstellungen, Schritt 7 in deploy.sh) abgeschlossen ist – frischer Browser, öffentliche Adresse.
      - name: Live-Check (Kurztest nach dem Veröffentlichen)
        id: live1
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          FOTOALERT_LIVECHECK_PASSWORD: ${{ secrets.FOTOALERT_LIVECHECK_PASSWORD }}
        run: |
          date +%s > "$RUNNER_TEMP/live_start.txt"
          sleep 5
          ERW="$ERWARTETE_VERSION"
          if [ "$BRANDPROBE" = "ja" ]; then
            echo "BRANDPROBE: Live-Check scheitert absichtlich (erwartet wird eine Version, die es nicht gibt)"
            ERW="0.0.0-brandprobe"
          fi
          python FotoAlert/backend/tests/livecheck/kurztest.py \
            --adresse "$LIVECHECK_ADRESSE" --erwartete-version "$ERW" \
            --ergebnis-ordner "$RUNNER_TEMP/livecheck/live1"

      # AK23: Hat schon deploy.sh selbst zurückgesprungen (Server antwortete nicht), prüft derselbe
      # Kurztest die zurückgeholte Version.
      - name: Nachprüfung nach Rücksprung durch das Veröffentlichen
        id: nachpruefung
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          FOTOALERT_LIVECHECK_PASSWORD: ${{ secrets.FOTOALERT_LIVECHECK_PASSWORD }}
        run: |
          date +%s > "$RUNNER_TEMP/live_start.txt"
          AUF=$(sed -n 's/^RUECKSPRUNG_AUF_VERSION=//p' "$RUNNER_TEMP/deploy-ausgabe.txt" | tail -1)
          if [ -z "$AUF" ] || [ "$AUF" = "unbekannt" ]; then
            echo "Kein Rücksprung durch das Veröffentlichen erkennbar – keine Nachprüfung möglich."
            exit 1
          fi
          python FotoAlert/backend/tests/livecheck/kurztest.py \
            --adresse "$LIVECHECK_ADRESSE" --erwartete-version "$AUF" \
            --ergebnis-ordner "$RUNNER_TEMP/livecheck/nachpruefung"

      # AK15/AK16/AK17/AK18: Rücksprung auf die zuletzt BESTÄTIGTE Version, ohne Rückfrage, auf dem
      # Server (nur die App, nie die Datenbank). Im Übungsmodus nur ein Platzhalter.
      - name: Automatischer Rücksprung
        id: rueck
        if: steps.live1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        env:
          SSH_ZIEL: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}
        run: |
          if [ "$UEBUNG" = "ja" ]; then
            echo "ÜBUNG: Platzhalter – kein echter Rücksprung"
            {
              echo "RUECKSPRUNG_ERGEBNIS=gelungen"
              echo "RUECKSPRUNG_VON_VERSION=$ERWARTETE_VERSION"
              echo "RUECKSPRUNG_AUF_VERSION=$ERWARTETE_VERSION"
            } | tee "$RUNNER_TEMP/ruecksprung-ausgabe.txt"
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
              "$SSH_ZIEL" "bash /opt/fotoalert/app/FotoAlert/deploy/ruecksprung.sh zurueck" 2>&1 \
              | tee "$RUNNER_TEMP/ruecksprung-ausgabe.txt"

      # AK19: derselbe Kurztest gegen die zurückgeholte Version.
      - name: Live-Check nach dem Rücksprung
        id: live2
        if: steps.rueck.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          FOTOALERT_LIVECHECK_PASSWORD: ${{ secrets.FOTOALERT_LIVECHECK_PASSWORD }}
        run: |
          AUF=$(sed -n 's/^RUECKSPRUNG_AUF_VERSION=//p' "$RUNNER_TEMP/ruecksprung-ausgabe.txt" | tail -1)
          if [ -z "$AUF" ] || [ "$AUF" = "unbekannt" ]; then
            echo "Zielversion des Rücksprungs unbekannt – kein erneuter Kurztest möglich."
            exit 1
          fi
          python FotoAlert/backend/tests/livecheck/kurztest.py \
            --adresse "$LIVECHECK_ADRESSE" --erwartete-version "$AUF" \
            --ergebnis-ordner "$RUNNER_TEMP/livecheck/live2"

      # AK13: Bestehen alle sechs Prüfpunkte, gilt die neue Version als „zuletzt bestätigt“.
      - name: Neue Version als „zuletzt bestätigt“ vermerken
        id: bestaetigen
        if: steps.live1.outcome == 'success'
        shell: bash
        env:
          SSH_ZIEL: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}
        run: |
          if [ "$UEBUNG" = "ja" ]; then
            echo "ÜBUNG: Platzhalter – keine Marke gesetzt"
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
              "$SSH_ZIEL" "bash /opt/fotoalert/app/FotoAlert/deploy/ruecksprung.sh bestaetigen"

      # AK25: Meldung – wer sie liest, sieht ohne Nachsehen: welche Version zurückgenommen wurde,
      # welcher Prüfpunkt woran scheiterte, auf welche Version zurückgesprungen wurde und ob das
      # geklappt hat. Bildschirmfotos liegen im Artefakt. Geheimnisse erscheinen nie (der Kurztest
      # maskiert sie, GitHub zusätzlich).
      - name: Meldung zusammenstellen
        if: always()
        shell: bash
        env:
          O_VORAB: ${{ steps.vorab.outcome }}
          O_DEPLOY: ${{ steps.deploy.outcome }}
          O_LIVE1: ${{ steps.live1.outcome }}
          O_NACHPR: ${{ steps.nachpruefung.outcome }}
          O_RUECK: ${{ steps.rueck.outcome }}
          O_LIVE2: ${{ steps.live2.outcome }}
          ARTEFAKT: livecheck-${{ github.run_id }}
        run: |
          D="$RUNNER_TEMP/livecheck"
          gescheitert() {  # Prüfpunkte samt Grund aus einer Ergebnisdatei
            [ -f "$D/$1/kurztest-ergebnis.txt" ] && grep -A1 '^gescheitert:' "$D/$1/kurztest-ergebnis.txt" | grep -v '^--$' | sed 's/^ *//' || true
          }
          rueckwert() { sed -n "s/^$2=//p" "$RUNNER_TEMP/$1" 2>/dev/null | tail -1; }
          {
            echo "## Live-Check nach dem Veröffentlichen (TASK-118)"
            [ "$UEBUNG" = "ja" ] && echo "**Übungsmodus (Teststufe 3):** nichts wurde veröffentlicht, der Rücksprung ist ein Platzhalter."
            [ "$BRANDPROBE" = "ja" ] && echo "**Brandprobe (Teststufe 4):** der Live-Check wurde absichtlich scheitern gelassen."
            echo ""
            echo "- Erwartete App-Version: ${ERWARTETE_VERSION:-unbekannt}"
            if [ "$O_VORAB" = "failure" ]; then
              echo "- **Prüfung nicht einsatzbereit** – die Vorab-Probe gegen die laufende Version ist gescheitert, es wurde nichts veröffentlicht."
              gescheitert vorab | sed 's/^/  - /'
            fi
            [ "$O_DEPLOY" = "failure" ] && echo "- Das Veröffentlichen ist fehlgeschlagen (siehe Schritt „Veröffentlichen“)."
            if [ "$O_LIVE1" = "success" ]; then echo "- Live-Check: **bestanden**, die neue Version bleibt live und gilt als zuletzt bestätigt."; fi
            if [ "$O_LIVE1" = "failure" ]; then
              echo "- Live-Check: **gescheitert** – zurückgenommene Version: ${ERWARTETE_VERSION:-unbekannt}"
              gescheitert live1 | sed 's/^/  - /'
              if [ -d "$D/live1" ] && ls "$D/live1"/*.png >/dev/null 2>&1; then echo "  - Bildschirmfoto: Artefakt ${ARTEFAKT}, Ordner live1"; fi
            fi
            if [ "$O_RUECK" = "success" ]; then
              echo "- Rücksprung: **gelungen** – zurück auf Version $(rueckwert ruecksprung-ausgabe.txt RUECKSPRUNG_AUF_VERSION)"
            elif [ "$O_RUECK" = "failure" ]; then
              echo "- Rücksprung: **fehlgeschlagen – manueller Eingriff nötig** (letzter bekannter Zustand steht im Schritt „Automatischer Rücksprung“)"
            fi
            if [ "$O_LIVE2" = "success" ]; then echo "- Erneuter Live-Check gegen die zurückgeholte Version: **bestanden**"; fi
            if [ "$O_LIVE2" = "failure" ]; then
              echo "- Erneuter Live-Check gegen die zurückgeholte Version: **gescheitert** – Rücksprung fehlgeschlagen – manueller Eingriff nötig"
              gescheitert live2 | sed 's/^/  - /'
            fi
            if [ "$O_DEPLOY" = "failure" ]; then
              echo "- Rücksprung durch das Veröffentlichen selbst: von $(rueckwert deploy-ausgabe.txt RUECKSPRUNG_VON_VERSION) auf $(rueckwert deploy-ausgabe.txt RUECKSPRUNG_AUF_VERSION), Ergebnis: $(rueckwert deploy-ausgabe.txt RUECKSPRUNG_ERGEBNIS)"
              [ "$O_NACHPR" = "success" ] && echo "- Nachprüfung der zurückgeholten Version: **bestanden**"
              [ "$O_NACHPR" = "failure" ] && echo "- Nachprüfung der zurückgeholten Version: **nicht bestanden** – Rücksprung fehlgeschlagen – manueller Eingriff nötig"
            fi
            if [ -f "$RUNNER_TEMP/live_start.txt" ]; then
              DAUER=$(( $(date +%s) - $(cat "$RUNNER_TEMP/live_start.txt") ))
              echo "- Dauer von Live-Check bis Ende (Live-Check, Rücksprung, erneuter Live-Check): ${DAUER} s (Grenze 600 s)"
              [ "$DAUER" -gt 600 ] && echo "::warning title=Live-Check dauerte zu lange::${DAUER} s statt höchstens 600 s"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Ergebnisse und Bildschirmfotos sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livecheck-${{ github.run_id }}
          path: ${{ runner.temp }}/livecheck/
          if-no-files-found: ignore

      # AK26: Ein Lauf mit Rücksprung endet IMMER rot – auch wenn der Rücksprung gelang –, damit
      # das Ticket nicht auf Done geht. Die Schritte oben dürfen rot enden (continue-on-error),
      # damit Nachprüfung und Meldung laufen; hier wird das Gesamtergebnis festgelegt.
      - name: Ergebnis festlegen (Lauf mit Rücksprung endet immer rot)
        if: always()
        shell: bash
        env:
          O_DEPLOY: ${{ steps.deploy.outcome }}
          O_LIVE1: ${{ steps.live1.outcome }}
          O_RUECK: ${{ steps.rueck.outcome }}
          O_LIVE2: ${{ steps.live2.outcome }}
        run: |
          ROT=0
          if [ "$O_DEPLOY" = "failure" ]; then
            echo "::error title=Veröffentlichen fehlgeschlagen::Das Veröffentlichen ist fehlgeschlagen; falls der Server zurückgesprungen ist, läuft die zuletzt bestätigte Version. Siehe Meldung."
            ROT=1
          fi
          if [ "$O_LIVE1" = "failure" ]; then
            echo "::error title=Live-Check gescheitert::Version ${ERWARTETE_VERSION:-unbekannt} wurde zurückgenommen bzw. der Rücksprung wurde versucht – Details in der Meldung dieses Laufs."
            ROT=1
          fi
          if [ "$O_RUECK" = "failure" ] || [ "$O_LIVE2" = "failure" ]; then
            echo "::error title=Rücksprung fehlgeschlagen::Rücksprung fehlgeschlagen – manueller Eingriff nötig"
          fi
          if [ "$O_RUECK" = "success" ] && [ "$O_LIVE2" = "success" ]; then
            echo "::error title=Rücksprung gelungen::Der Rücksprung ist gelungen, der Lauf endet trotzdem rot, damit das Ticket nicht auf Done geht."
          fi
          [ "$O_RUECK" != "skipped" ] && ROT=1
          [ "$O_LIVE2" = "failure" ] && ROT=1
          exit "$ROT"

      - name: SSH-Key aufräumen
        if: always()
        run: rm -f ~/.ssh/deploy_key
